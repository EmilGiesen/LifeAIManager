<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>LifeAI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="kopf">
    <div>
      <p class="kopf-datum" id="kopf-datum"></p>
      <h1 id="kopf-gruss">LifeAI</h1>
    </div>
    <button class="icon-btn" id="btn-neu" aria-label="Aktualisieren">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <main>
    <!-- HEUTE -->
    <section class="ansicht" id="ansicht-heute">
      <div id="heute-inhalt"><div class="laden">Lade …</div></div>
    </section>

    <!-- AUFGABEN -->
    <section class="ansicht" id="ansicht-aufgaben" hidden>
      <div class="zeile-oben">
        <h2>Aufgaben</h2>
        <label class="schalter"><input type="checkbox" id="zeige-erledigte"> <span>Erledigte zeigen</span></label>
      </div>
      <div id="aufgaben-inhalt"><div class="laden">Lade …</div></div>
    </section>

    <!-- EINSTELLUNGEN -->
    <section class="ansicht" id="ansicht-einstellungen" hidden>
      <h2>Einstellungen</h2>
      <div class="karte">
        <h3>Benachrichtigungen</h3>
        <p class="leise" id="push-status">Prüfe …</p>
        <div class="knopf-reihe">
          <button class="knopf" id="btn-push">Aktivieren</button>
          <button class="knopf zweit" id="btn-push-test" hidden>Test senden</button>
        </div>
        <p class="leise klein">Du bekommst: das Briefing (06:30 und 16:00), Ausfälle/Vertretungen für heute und morgen und neue Aufgaben.</p>
      </div>
      <div class="karte">
        <h3>Datenstand</h3>
        <p class="leise" id="info-stand">–</p>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab aktiv" data-ziel="heute">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Heute</span>
    </button>
    <button class="tab" data-ziel="aufgaben">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span>Aufgaben</span><b class="badge" id="badge-aufgaben" hidden></b>
    </button>
    <button class="tab" data-ziel="einstellungen">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Einstellungen</span>
    </button>
  </nav>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
